services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: betting
      POSTGRES_USER: betting
      POSTGRES_PASSWORD: betting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      UsePostgres: "true"
      ConnectionStrings__Postgres: "Host=db;Database=betting;Username=betting;Password=betting"
    depends_on:
      db:
        condition: service_healthy
